<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Suomi design gallery</title>
    <!-- Review page only. Open with `npm run dev` at /src/design/gallery.html. Not a build entry. -->
    <style>
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        font-family: var(--font-sans);
        line-height: var(--leading-normal);
        color: var(--text);
        background: var(--bg);
      }
      .g-page {
        max-width: 60rem;
        margin: 0 auto;
        padding: 0 var(--space-4) var(--space-8);
      }
      .g-top {
        position: sticky;
        top: 0;
        z-index: var(--z-toast);
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-3);
        align-items: center;
        justify-content: space-between;
        padding: var(--space-3) 0;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
      }
      :where(.g-top) h1 {
        margin: 0;
        font-size: var(--text-xl);
      }
      :where(.g-page) h2 {
        margin: var(--space-7) 0 var(--space-3);
        font-size: var(--text-2xl);
        letter-spacing: var(--tracking-tight);
      }
      :where(.g-page) h3 {
        margin: var(--space-5) 0 var(--space-2);
        font-size: var(--text-md);
        color: var(--muted);
      }
      .g-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr));
        gap: var(--space-3);
      }
      .g-swatch {
        overflow: hidden;
        font-size: var(--text-xs);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
      }
      .g-swatch > i {
        display: block;
        height: 3rem;
        border-bottom: 1px solid var(--line);
      }
      .g-swatch > span {
        display: block;
        padding: var(--space-1) var(--space-2);
        overflow-wrap: anywhere;
      }
      .g-swatch code {
        color: var(--muted);
      }
      .g-pair {
        padding: var(--space-2) var(--space-3);
        font-size: var(--text-sm);
        font-weight: 600;
        border-radius: var(--radius-sm);
      }
      .g-icon {
        display: grid;
        gap: var(--space-1);
        justify-items: center;
        padding: var(--space-3) var(--space-1);
        font-size: var(--text-xs);
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
      }
      .g-row {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-3);
        align-items: center;
      }
      .g-stack {
        display: grid;
        gap: var(--space-3);
        max-width: 26rem;
      }
      .g-bar {
        height: 1rem;
        background: var(--accent);
        border-radius: 2px;
      }
      .g-box {
        display: grid;
        place-items: center;
        width: 5rem;
        height: 5rem;
        font-size: var(--text-xs);
        background: var(--surface);
        border: 1px solid var(--line);
      }
      /* transform makes this the containing block for the fixed tab bar and sheet inside it */
      .g-phone {
        position: relative;
        width: min(100%, 375px);
        height: 620px;
        overflow: hidden;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-lg);
        transform: translateZ(0);
      }
      .g-phone-scroll {
        height: 100%;
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      .g-phone .app {
        min-height: 100%;
      }
      .g-lessons {
        display: grid;
        gap: var(--space-2);
        margin: 0;
        padding: 0;
        list-style: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./gallery.tsx"></script>
  </body>
</html>
